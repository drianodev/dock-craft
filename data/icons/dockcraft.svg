<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1c71"/>
      <stop offset="50%" stop-color="#d76d77"/>
      <stop offset="100%" stop-color="#ffaf7b"/>
    </linearGradient>
    <linearGradient id="dockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="iconGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <linearGradient id="iconGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="iconGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ba360"/>
      <stop offset="100%" stop-color="#3cba92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background App Canvas -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Floating Dock Island -->
  <g filter="url(#shadow)">
    <rect x="18" y="76" width="92" height="34" rx="17" fill="url(#dockGrad)"/>
    <rect x="18" y="76" width="92" height="34" rx="17" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.5"/>
  </g>

  <!-- Dock Icons -->
  <g>
    <!-- Icon 1 -->
    <rect x="25" y="83" width="16" height="16" rx="4" fill="url(#iconGrad1)"/>
    <circle cx="33" cy="104" r="1.5" fill="#ffffff"/>

    <!-- Icon 2 -->
    <rect x="47" y="83" width="16" height="16" rx="4" fill="url(#iconGrad2)"/>
    <circle cx="55" cy="104" r="1.5" fill="#ffffff"/>

    <!-- Icon 3 -->
    <rect x="69" y="83" width="16" height="16" rx="4" fill="url(#iconGrad3)"/>
    <circle cx="77" cy="104" r="1.5" fill="#ffffff"/>

    <!-- Icon 4 (App Grid) -->
    <rect x="91" y="83" width="16" height="16" rx="4" fill="url(#iconGrad4)"/>
    <circle cx="99" cy="104" r="1.5" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Magic Sparkle Wand above dock -->
  <path d="M64 24 L66.5 33 L75.5 35.5 L66.5 38 L64 47 L61.5 38 L52.5 35.5 L61.5 33 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M42 38 L43.5 43.5 L49 45 L43.5 46.5 L42 52 L40.5 46.5 L35 45 L40.5 43.5 Z" fill="#ffffff" opacity="0.75"/>
  <path d="M84 42 L85.5 46.5 L90 48 L85.5 49.5 L84 54 L82.5 49.5 L78 48 L82.5 46.5 Z" fill="#ffffff" opacity="0.75"/>
</svg>
